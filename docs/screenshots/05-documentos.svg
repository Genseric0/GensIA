<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="644" viewBox="0 0 1280 644">
<title>Pesquisa local em documentos</title>
<rect width="1280" height="644" rx="16" fill="#0d1117"/>
<text x="32" y="44" fill="#79c0ff" font-family="monospace" font-size="23">GensIA / Pesquisa local em documentos</text>
<text x="32" y="75" fill="#8b949e" font-family="monospace" font-size="16">Saída real da CLI • renderização documental • v0.21.0</text>
<text x="32" y="116" xml:space="preserve" fill="#7ee787" font-family="monospace" font-size="18">$ python -m gensia document --workspace . search DNS redes.txt</text>
<text x="32" y="140" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">{</text>
<text x="32" y="164" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;query&quot;: &quot;DNS&quot;,</text>
<text x="32" y="188" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;files_scanned&quot;: 1,</text>
<text x="32" y="212" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;chunks_scanned&quot;: 1,</text>
<text x="32" y="236" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;results&quot;: [</text>
<text x="32" y="260" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">    {</text>
<text x="32" y="284" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">      &quot;path&quot;: &quot;redes.txt&quot;,</text>
<text x="32" y="308" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">      &quot;location&quot;: {</text>
<text x="32" y="332" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">        &quot;lines&quot;: [</text>
<text x="32" y="356" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">          1,</text>
<text x="32" y="380" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">          2</text>
<text x="32" y="404" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">        ]</text>
<text x="32" y="428" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">      },</text>
<text x="32" y="452" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">      &quot;score&quot;: 1.0,</text>
<text x="32" y="476" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">      &quot;excerpt&quot;: &quot;DNS resolve nomes em endereços IP.\nDHCP distribui configuração de rede.&quot;</text>
<text x="32" y="500" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">    }</text>
<text x="32" y="524" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  ],</text>
<text x="32" y="548" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;local_only&quot;: true,</text>
<text x="32" y="572" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">  &quot;ranking&quot;: &quot;tf_idf_lexical&quot;</text>
<text x="32" y="596" xml:space="preserve" fill="#e6edf3" font-family="monospace" font-size="18">}</text>
